services:
  - type: web
    name: slm-voting
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ASANA_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SCHEDULE_TOKEN
        generateValue: true
      - key: FLASK_SECRET_KEY
        generateValue: true
